baseURL: https://blog.lordvidex.me.uk
locale: 'en-US'
title: Evans Owamoyo
theme: PaperModX
pagination:
  pagerSize: 10

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
services:
  disqus:
    shortname: lordvidex
  googleAnalytics:
    id: G-96RFRJ202J

minify:
  disableXML: true

params:
  favicon: /favicon.ico
  themeColor: '#FFD700'
  title: Evans Owamoyo
  description: >
    Personal Blog of Evans Owamoyo.
    Here, I write articles, share insights and log my notes and thoughts.
  author: 'Evans Owamoyo'
  keywords: [Evans, Owamoyo, Blog, Archives, Logs, lordvidex]
  images: [avatar.jpg]

  ShowReadingTime: true
  ShowShareButtons: true
  ShowBreadCrumbs: true
  ShowToc: true
  TocOpen: true
  comments: true
  defaultTheme: dark
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true

  mainSections: ['posts', 'notes']

  # X specifics
  TocSide: left

  
  homeInfoParams:
    Title: Evans Owamoyo
    Content: >
      **Software Engineer** ■ Flutterist ■ Gopher ■ Java developer.
    imageUrl: /avatar.jpg
    imageHeight: 200
    imageWidth: 200
  socialIcons:
    - name: twitter
      url: https://twitter.com/lordvidex
    - name: stackoverflow
      url: https://stackoverflow.com/users/11320345/lordvidex
    - name: github
      url: https://github.com/lordvidex/

menu:
  main:
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 10
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20    
    - identifier: search
      name: Search
      url: /search/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON 
